<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width">
  <title>AGY Chrome Bridge</title>
  <style>
    :root {
      --bg: #f6f7fb; --surface: #ffffff; --text: #1b1d29; --muted: #5d6275; --line: #e3e5ee;
      --brand-a: #4c32d6; --brand-b: #0eaabe; --accent: #4c32d6; --accent-text: #ffffff;
      --ok: #1e8e3e; --warn: #c27c0e; --bad: #c5221f; --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14151c; --surface: #1e2029; --text: #eceef6; --muted: #9a9fb3; --line: #2d303c; --accent: #8f7dff; --accent-text: #14151c; --bad: #f28b82; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 340px; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; color: #fff;
      background: linear-gradient(120deg, var(--brand-a), var(--brand-b)); }
    header img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 2px 6px rgb(0 0 0 / .25); }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
    #version { margin: 0; font-size: 11px; opacity: .85; }
    main { padding: 12px 14px 10px; display: grid; gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .status-row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    #pill[data-state="ok"] .dot { background: var(--ok); box-shadow: 0 0 0 3px rgb(30 142 62 / .18); }
    #pill[data-state="busy"] .dot { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
    #pill[data-state="bad"] .dot { background: var(--bad); }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { #pill[data-state="busy"] .dot { animation: none; } }
    #status { font-weight: 600; }
    #detail { margin: 6px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .link { margin-left: auto; padding: 2px 6px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; border-radius: 6px; }
    .link:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
    #tab { margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #origin { margin: 2px 0 10px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    #toggle { width: 100%; padding: 9px 12px; border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-text);
      font: inherit; font-weight: 600; cursor: pointer; transition: filter .15s, transform .05s; }
    #toggle:hover:not(:disabled) { filter: brightness(1.08); }
    #toggle:active:not(:disabled) { transform: translateY(1px); }
    #toggle[data-shared="true"] { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
    #toggle:disabled { opacity: .45; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #unavailable { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    #shared { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    #shared li { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; }
    #shared li:hover { background: var(--bg); }
    #shared li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #shared li.empty { color: var(--muted); }
    #shared li button { flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; }
    #shared li button:hover { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
    footer { padding: 0 16px 14px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div><h1>AGY Chrome Bridge</h1><p id="version"></p></div>
  </header>
  <main>
    <section class="card" aria-label="Connection">
      <div class="status-row" id="pill" data-state="busy">
        <span class="dot" aria-hidden="true"></span>
        <span id="status" aria-live="polite">Connecting…</span>
        <button id="reconnect" class="link">Reconnect</button>
      </div>
      <p id="detail" hidden></p>
    </section>
    <section class="card" aria-label="Current tab">
      <p class="eyebrow">Current tab</p>
      <p id="tab"></p>
      <p id="origin"></p>
      <button id="toggle" disabled>Share this tab</button>
      <p id="unavailable" hidden>Open an HTTP or HTTPS page to share it.</p>
    </section>
    <section class="card" aria-label="Shared tabs">
      <p class="eyebrow">Shared with AGY</p>
      <ul id="shared"></ul>
    </section>
  </main>
  <footer>AGY can read and operate only the tabs you share. Sharing ends when Chrome closes.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
